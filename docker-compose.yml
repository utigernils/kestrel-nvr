# Alternative zum install.sh:  docker compose up -d --build
# Vorher config.example.yml nach ./config/config.yml kopieren und anpassen.
services:
  kestrel:
    build: .
    image: kestrel-nvr:latest
    container_name: kestrel-nvr
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Zurich
    volumes:
      - ./config:/config
      - ./data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"
